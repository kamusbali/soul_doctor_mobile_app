name: Flutter CI/CD

on:
  push:
    branches:
      - dev
      - staging
      - main
      - "release/**"

  pull_request:
    branches:
      - dev
      - staging
      - main
      - "release/**"

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ############################################################
  # PULL REQUEST VALIDATION
  ############################################################

  validate:
    name: Validate Pull Request
    if: github.event_name == 'pull_request'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install Flutter SDK
        run: |
          fvm install
          fvm flutter --version
          fvm dart --version

      # PR validation tidak memakai credential environment asli.
      # File ini hanya memastikan flutter_dotenv dan asset .env tersedia saat test.
      - name: Generate Test .env
        shell: bash
        run: |
          cat > .env <<'EOF'
          ENV_NAME=test
          BASE_URL=https://example.invalid
          EOF

      - name: Validate .env
        shell: bash
        run: |
          test -s .env || {
            echo ".env was not generated or is empty"
            exit 1
          }

          grep -q '^ENV_NAME=' .env || {
            echo "ENV_NAME is missing from .env"
            exit 1
          }

          grep -q '^BASE_URL=' .env || {
            echo "BASE_URL is missing from .env"
            exit 1
          }

          echo ".env is valid"

      - name: Install Flutter Dependencies
        run: fvm flutter pub get

      - name: Analyze
        run: fvm flutter analyze

      - name: Test
        run: fvm flutter test

  ############################################################
  # DETERMINE PUSH CONFIGURATION
  ############################################################

  prepare:
    name: Prepare Configuration
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    outputs:
      environment_name: ${{ steps.config.outputs.environment_name }}
      fastlane_lane: ${{ steps.config.outputs.fastlane_lane }}
      artifact_name: ${{ steps.config.outputs.artifact_name }}
      build_ios: ${{ steps.config.outputs.build_ios }}

    steps:
      - name: Determine Branch Configuration
        id: config
        shell: bash
        run: |
          BRANCH="$GITHUB_REF_NAME"

          case "$BRANCH" in
            dev)
              echo "environment_name=development" >> "$GITHUB_OUTPUT"
              echo "fastlane_lane=development" >> "$GITHUB_OUTPUT"
              echo "artifact_name=Development" >> "$GITHUB_OUTPUT"
              echo "build_ios=false" >> "$GITHUB_OUTPUT"
              ;;

            staging)
              echo "environment_name=staging" >> "$GITHUB_OUTPUT"
              echo "fastlane_lane=deploy_staging" >> "$GITHUB_OUTPUT"
              echo "artifact_name=Staging" >> "$GITHUB_OUTPUT"
              echo "build_ios=true" >> "$GITHUB_OUTPUT"
              ;;

            release/*)
              echo "environment_name=release" >> "$GITHUB_OUTPUT"
              echo "fastlane_lane=release" >> "$GITHUB_OUTPUT"
              echo "artifact_name=Release-Candidate" >> "$GITHUB_OUTPUT"
              echo "build_ios=true" >> "$GITHUB_OUTPUT"
              ;;

            main)
              echo "environment_name=production" >> "$GITHUB_OUTPUT"
              echo "fastlane_lane=production" >> "$GITHUB_OUTPUT"
              echo "artifact_name=Production" >> "$GITHUB_OUTPUT"
              echo "build_ios=true" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "Unsupported branch: $BRANCH"
              exit 1
              ;;
          esac

  ############################################################
  # BUILD AND DISTRIBUTE
  ############################################################

  build-and-distribute:
    name: Build ${{ needs.prepare.outputs.artifact_name }}
    if: github.event_name == 'push'
    needs: prepare
    runs-on: macos-latest

    environment:
      name: ${{ needs.prepare.outputs.environment_name }}

    env:
      BUILD_NUMBER: ${{ github.run_number }}

      # Android
      ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}

      # iOS
      IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}
      APPLE_DEVELOPER_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID }}

      # Fastlane Match
      MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

      # App Store Connect
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

    steps:
      ########################################################
      # SETUP
      ########################################################

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install Flutter SDK
        run: |
          fvm install
          fvm flutter --version
          fvm dart --version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      ########################################################
      # GENERATE FLUTTER DOTENV
      ########################################################

      - name: Generate .env
        shell: bash
        env:
          DOTENV_CONTENT: ${{ secrets.DOTENV }}
        run: |
          if [[ -z "$DOTENV_CONTENT" ]]; then
            echo "DOTENV secret is not configured for environment: ${{ needs.prepare.outputs.environment_name }}"
            exit 1
          fi

          # printf mempertahankan baris dan menghindari masalah heredoc expansion.
          printf '%s\n' "$DOTENV_CONTENT" > .env

      - name: Validate .env
        run: |
          if [[ ! -f ".env" ]]; then
            echo ".env not found"
            exit 1
          fi

          if [[ ! -s ".env" ]]; then
            echo ".env is empty"
            exit 1
          fi

          echo ".env generated successfully"

      ########################################################
      # FLUTTER VALIDATION
      ########################################################

      - name: Install Flutter Dependencies
        run: fvm flutter pub get

      # - name: Analyze
      #   run: fvm flutter analyze

      # - name: Test
      #   run: fvm flutter test

      ########################################################
      # RUBY DEPENDENCIES
      ########################################################

      - name: Install Android Gems
        working-directory: android
        run: bundle install

      - name: Install iOS Gems
        if: needs.prepare.outputs.build_ios == 'true'
        working-directory: ios
        run: bundle install

      ########################################################
      # ANDROID SIGNING
      ########################################################

      - name: Setup Android Signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          fi

          mkdir -p android/keystore

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/keystore/upload-keystore.jks

          if [[ ! -s android/keystore/upload-keystore.jks ]]; then
            echo "Failed to decode Android keystore"
            exit 1
          fi

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../keystore/upload-keystore.jks
          EOF

      ########################################################
      # GOOGLE PLAY CREDENTIALS
      ########################################################

      - name: Setup Google Play Credentials
        if: github.ref_name == 'staging' || github.ref_name == 'main'
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          if [[ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" ]]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 is not configured"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/google-play"

          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/google-play/service-account.json"

          if [[ ! -s "$RUNNER_TEMP/google-play/service-account.json" ]]; then
            echo "Failed to decode Google Play service account JSON"
            exit 1
          fi

          echo "GOOGLE_PLAY_JSON_KEY_PATH=$RUNNER_TEMP/google-play/service-account.json" \
            >> "$GITHUB_ENV"

      ########################################################
      # VERSION
      ########################################################

      - name: Get App Version
        id: version
        shell: bash
        run: |
          FULL_VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml)
          VERSION_NAME="${FULL_VERSION%%+*}"

          if [[ -z "$VERSION_NAME" ]]; then
            echo "Version was not found in pubspec.yaml"
            exit 1
          fi

          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Version name: $VERSION_NAME"
          echo "Build number: $BUILD_NUMBER"

      ########################################################
      # ANDROID BUILD / DISTRIBUTION
      ########################################################

      - name: Run Android Fastlane
        working-directory: android
        env:
          FASTLANE_LANE: ${{ needs.prepare.outputs.fastlane_lane }}
        run: bundle exec fastlane "$FASTLANE_LANE"

      ########################################################
      # IOS BUILD / DISTRIBUTION
      ########################################################

      - name: Run iOS Fastlane
        if: needs.prepare.outputs.build_ios == 'true'
        working-directory: ios
        env:
          FASTLANE_LANE: ${{ needs.prepare.outputs.fastlane_lane }}
        run: bundle exec fastlane "$FASTLANE_LANE"

      ########################################################
      # ARTIFACTS
      ########################################################

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: >-
            [${{ needs.prepare.outputs.artifact_name }}]
            Android-v${{ steps.version.outputs.version }}+
            ${{ env.BUILD_NUMBER }}
          path: build/app/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload iOS Artifact
        if: needs.prepare.outputs.build_ios == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: >-
            [${{ needs.prepare.outputs.artifact_name }}]
            iOS-v${{ steps.version.outputs.version }}+
            ${{ env.BUILD_NUMBER }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14